name: Build Kaguya APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build native core (Rust)
        run: |
          mkdir -p app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -o app/src/main/jniLibs build --release --manifest-path kaguya-core/Cargo.toml

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APKs
        id: apk
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          D=app/build/outputs/apk/debug
          cp "$D/app-universal-debug.apk" "$D/kaguya-v${VERSION}-debug.apk"
          cp "$D/app-arm64-v8a-debug.apk" "$D/kaguya-v${VERSION}-arm64-v8a.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version }}
        run: |
          D=app/build/outputs/apk/debug
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "$D/kaguya-v${{ steps.apk.outputs.version }}-debug.apk" \
            "$D/kaguya-v${{ steps.apk.outputs.version }}-arm64-v8a.apk" \
            --title "Kaguya $TAG" \
            --notes "Kaguya $TAG (debug build). Fork of Kuro by ayashiiiyo, GPL-3.0." \
            --latest
